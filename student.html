<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="logo nex.jpeg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Dashboard — Check-in and check-out from your hostel.">
  <title>NexTrack — Student Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- PWA & Mobile Optimization -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">

  <!-- Background -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <!-- Top Bar -->
  <header class="topbar glass">
    <div class="topbar-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#grad2)" stroke-width="2">
        <defs><linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#667eea"/><stop offset="100%" stop-color="#764ba2"/></linearGradient></defs>
        <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span>NexTrack</span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost chat-btn" id="chat-toggle-btn" onclick="toggleChat()">💬 Chat <span class="chat-badge" id="chat-badge" style="display:none;">0</span></button>
      <button class="btn btn-ghost" onclick="openProfileModal()">✏️ Profile</button>
      <button class="btn btn-ghost" onclick="logout()">🚪 Logout</button>
    </div>
  </header>

  <main class="stu-main">
    <!-- Student Info Card -->
    <section class="stu-info-card glass">
      <div class="stu-avatar" id="stu-avatar">👤</div>
      <div class="stu-details">
        <h2 id="stu-name">—</h2>
        <p class="stu-meta"><span class="label">ID:</span> <span id="stu-id">—</span></p>
        <p class="stu-meta"><span class="label">Room:</span> <span id="stu-room">—</span></p>
      </div>
      <div class="stu-status-wrap">
        <span class="status-badge badge-in" id="stu-status">IN</span>
      </div>
    </section>

    <!-- Action Buttons -->
    <section class="stu-actions">
      <button class="btn btn-action btn-checkout" id="btn-checkout">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Check-Out
      </button>
      <button class="btn btn-action btn-checkin" id="btn-checkin">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Check-In
      </button>
    </section>

    <p class="debounce-timer" id="debounce-timer" style="display:none;"></p>

    <!-- Today History -->
    <section class="stu-history glass">
      <h3>📋 Today's Movements</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Out-Time</th>
              <th>In-Time</th>
              <th>Duration</th>
            </tr>
          </thead>
          <tbody id="history-body">
            <tr><td colspan="4" class="empty-row">No movements today</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Floating Chat Panel -->
  <div class="chat-floating-panel" id="chat-panel" style="display:none;">
    <div class="chat-container glass">
      <div class="chat-header">
        <h3>💬 Hostel Group Chat</h3>
        <button class="modal-x-btn" onclick="toggleChat()" style="position:static;font-size:1.3rem;">&times;</button>
      </div>
      <div class="chat-messages" id="student-chat-messages">
        <div class="chat-empty">No messages yet. Start the conversation!</div>
      </div>
      <form class="chat-input-bar" id="student-chat-form" onsubmit="sendStudentMessage(event)">
        <input type="text" id="student-chat-input" placeholder="Type a message..." autocomplete="off" required>
        <button type="submit" class="btn btn-primary btn-small">➤</button>
      </form>
    </div>
  </div>

  <!-- Message Context Menu -->
  <div class="msg-context-menu" id="msg-context-menu" style="display:none;">
    <button onclick="editSelectedMessage()">✏️ Edit</button>
    <button onclick="deleteSelectedMessage()">🗑️ Delete</button>
  </div>

  <!-- Profile Update Modal -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal glass" style="max-width:420px;">
      <button class="modal-x-btn" id="modal-close-btn" onclick="document.getElementById('profile-modal').classList.remove('visible')">&times;</button>
      <h3 style="margin-bottom:1.2rem;">My Profile</h3>
      <p class="modal-forced-msg" id="modal-forced-msg" style="display:none;">
        ⚠️ Your profile hasn't been updated in over 90 days. Please update before continuing.
      </p>
      <form id="profile-form">
        <div class="form-group" style="text-align:center;">
          <div class="detail-photo-wrap" id="profile-avatar" style="margin:0 auto 0.8rem;"></div>
          <label for="profile-photo-input" class="btn btn-small btn-accent" style="cursor:pointer;">📷 Change Photo</label>
          <input type="file" id="profile-photo-input" accept="image/*" style="display:none;">
        </div>
        <div class="form-group">
          <label for="profile-stu-id">Registration No.</label>
          <input type="text" id="profile-stu-id" required>
        </div>
        <div class="form-group">
          <label for="profile-name">Name</label>
          <input type="text" id="profile-name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="profile-age">Age</label>
            <input type="number" id="profile-age" min="15" max="99" required>
          </div>
          <div class="form-group">
            <label for="profile-dept">Department</label>
            <input type="text" id="profile-dept" required>
          </div>
        </div>
        <div class="form-group">
          <label for="profile-year">Current Year</label>
          <select id="profile-year" required style="width:100%;padding:10px 12px;background:rgba(255,255,255,0.04);border:1px solid rgba(100,120,255,0.12);border-radius:8px;color:#e8ecf5;font-family:inherit;font-size:0.92rem;outline:none;cursor:pointer;">
            <option value="" disabled>Select Year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="profile-room">Room No.</label>
            <input type="text" id="profile-room" required>
          </div>
          <div class="form-group">
            <label for="profile-phone">Phone</label>
            <input type="tel" id="profile-phone" required>
          </div>
        </div>
        <div class="modal-btns">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-ghost" id="modal-cancel-btn" onclick="document.getElementById('profile-modal').classList.remove('visible')">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=26"></script>
  <script src="js/data.js?v=26"></script>
  <script src="js/student.js?v=26"></script>
  <script src="js/pwa.js?v=26"></script>
</body>
</html>
